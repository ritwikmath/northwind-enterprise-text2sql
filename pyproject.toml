[project]
name = "text-to-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ritwikmath", email = "ritwikmath@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.0",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-pinecone>=0.2.13",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "pinecone>=7.3.0",
    "psycopg[binary,pool]",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "textual>=8.2.8",
]

[project.scripts]
text-to-sql = "text_to_sql:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
python_files = ["test_*.py", "*_evaluation.py"]
